<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tarot Reels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
<style>
  /* Reset e Configurações Básicas */
  body {
    margin: 0;
    padding: 0;
    background-color: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Cormorant Garamond', serif;
    overscroll-behavior-y: contain; 
  }

  /* Container Principal */
  .app-container {
    width: 100vw;
    height: 100vh;
    max-width: 56.25vh; 
    background-color: #83A9C7; /* Azul Padrão */
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: background-color 0.5s ease;
  }

  /* Sistema de Texturas Globais (Mantido apenas Liso e Grain 1) */
  .texture-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 50; 
    opacity: 0;
    transition: opacity 0.5s ease, background-image 0.5s ease;
  }

  .app-container.texture-grain-1 .texture-overlay {
    opacity: 0.15; 
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }
  .app-container.light-mode.texture-grain-1 .texture-overlay {
    opacity: 0.25; 
    mix-blend-mode: multiply;
  }

  @media (max-width: 600px) {
    .app-container { max-width: 100vw; }
  }

  /* Tela Inicial */
  #start-screen {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 20;
    padding: 20px;
    text-align: center;
  }

  /* Estilos de Textos e Botões (Padrão Escuro) */
  .ui-text {
    color: #fff;
    transition: color 0.4s ease, border-color 0.4s ease, background-color 0.4s ease;
  }
  .ui-border {
    border: 1px solid #fff;
    transition: color 0.4s ease, border-color 0.4s ease, background-color 0.4s ease;
  }

  #start-btn {
    background: transparent;
    padding: 15px 40px;
    font-size: 1rem;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 30px;
  }
  #start-btn:hover { background: rgba(255, 255, 255, 0.1); }

  /* MODO CLARO - Quando o fundo for branco */
  .app-container.light-mode .ui-text { color: #111 !important; }
  .app-container.light-mode .ui-border { border-color: #111 !important; }
  .app-container.light-mode #start-btn:hover { background: rgba(0, 0, 0, 0.05); }
  .app-container.light-mode .opt-btn:hover { background: rgba(0, 0, 0, 0.05); }
  .app-container.light-mode .opt-btn.active { background: #111; color: #fff !important; }
  .app-container.light-mode .swatch { border-color: rgba(0,0,0,0.1); }
  .app-container.light-mode .swatch.active { border-color: #111 !important; }
  .app-container.light-mode .author-tag { color: rgba(0, 0, 0, 0.65) !important; }

  /* Seção de Configurações */
  .settings-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    width: 100%;
    max-height: 70vh;
    overflow-y: auto;
    padding-bottom: 20px;
  }

  .settings-group {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .settings-title {
    font-family: 'Montserrat', sans-serif;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 8px;
    opacity: 0.8;
  }

  /* Cores */
  .color-swatches {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 250px;
    align-items: center;
  }
  .swatch {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.2s ease, border-color 0.2s ease;
    box-sizing: border-box;
  }
  .swatch:hover { transform: scale(1.15); }
  .swatch.active { border-color: #fff; transform: scale(1.15); }

  input[type="color"].wheel-picker {
    padding: 0;
    border: 1px solid rgba(255,255,255,0.4);
    outline: none;
    -webkit-appearance: none;
    width: 26px; 
    height: 26px;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 25%, #a1c4fd 50%, #c2e9fb 75%, #d4fc79 100%);
    border-radius: 50%;
    box-shadow: inset 0 0 3px rgba(0,0,0,0.2);
  }
  input[type="color"].wheel-picker::-webkit-color-swatch-wrapper { padding: 0; }
  input[type="color"].wheel-picker::-webkit-color-swatch { border: none; border-radius: 50%; opacity: 0; }
  input[type="color"].wheel-picker::-moz-color-swatch { border: none; border-radius: 50%; opacity: 0; }

  /* Filtros e Texturas - Botões */
  .filter-buttons {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .opt-btn {
    background: transparent;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 5px 8px;
    border-radius: 20px;
    cursor: pointer;
  }
  .opt-btn.active {
    background: #fff;
    color: #111 !important;
  }

  /* Botão Grain na Tela Inicial (Configurações) */
  .preview-card-trigger {
    background: transparent;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
  }
  .preview-card-trigger:hover {
    background: rgba(255, 255, 255, 0.1);
  }
  .app-container.light-mode .preview-card-trigger:hover {
    background: rgba(0, 0, 0, 0.05);
  }

  /* Tela do Reel */
  #reels-screen {
    flex: 1;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    padding-top: 40px;
    z-index: 10;
  }

  .title {
    font-family: 'Montserrat', sans-serif;
    font-size: 1.5rem; 
    font-weight: 400;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 2px;
    position: absolute;
    top: 170px;
    width: 100%;
    z-index: 10;
    opacity: 0.9;
  }

  /* Container da Carta (Reduzido em 30% - era 75%, agora é 52.5%) */
  .card-wrapper {
    position: relative;
    width: 52.5%; 
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin-top: 40px;
  }

  .author-tag {
    position: absolute;
    top: -25px; 
    width: 100%;
    text-align: center;
    color: rgba(255, 255, 255, 0.65);
    font-family: 'Montserrat', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: color 0.4s ease;
  }

  .card-inner {
    position: relative;
    width: 100%;
    display: flex;
  }

  #tarot-card {
    width: 100%;
    height: auto;
    object-fit: contain;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.1s ease-out, filter 0.4s ease;
    user-select: none;
    -webkit-user-drag: none;
    z-index: 1;
  }

  #tarot-card:active {
    transform: scale(0.98);
  }

  /* Camada de Grain específica da Carta */
  .card-grain-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    opacity: 0; /* Controlado pelo slider de grain da carta */
    border-radius: 8px;
    z-index: 2;
    mix-blend-mode: multiply;
  }
  .app-container.light-mode .card-grain-layer {
    mix-blend-mode: darken;
  }

  /* Sobreposição do Conselho */
  #advice-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.7) 40%, rgba(0,0,0,0) 100%);
    color: #fff;
    padding: 60px 20px 25px;
    box-sizing: border-box;
    border-bottom-left-radius: 8px;
    border-bottom-right-radius: 8px;
    text-align: center;
    pointer-events: none;
    z-index: 5;
  }

  #card-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.6rem;
    font-weight: 600;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  #card-advice {
    font-family: 'Montserrat', sans-serif;
    font-size: 0.85rem;
    font-weight: 300;
    line-height: 1.6;
    letter-spacing: 0.5px;
    color: #eaeaea;
  }

  /* POP-UP GRAIN (Aumentado em 30%) */
  #grain-modal {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0, 0, 0, 0.85);
    z-index: 1000;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }

  .grain-modal-content {
    background: #1a1a1a;
    padding: 39px 26px; /* 30% maior */
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.1);
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 32px; /* 30% maior */
    position: relative;
  }

  .close-modal-btn {
    position: absolute;
    top: 12px; right: 18px;
    color: #aaa;
    font-size: 1.8rem;
    cursor: pointer;
    font-family: sans-serif;
  }
  .close-modal-btn:hover { color: #fff; }

  .popup-card-box {
    position: relative;
    width: 182px; /* 140px + 30% */
    border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
  }
  .popup-card-box img {
    width: 100%;
    display: block;
    border-radius: 8px;
  }

  .slider-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 234px; /* 180px + 30% */
  }

  /* Slider Vertical */
  input[type="range"].vertical-slider {
    -webkit-appearance: slider-vertical;
    appearance: slider-vertical;
    width: 10px;
    height: 100%;
    outline: none;
    cursor: pointer;
  }
  
  .slider-label {
    color: #fff;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
  }

</style>
</head>
<body>

<div class="app-container" id="main-container">
  
  <div class="texture-overlay" id="global-texture"></div>

  <!-- TELA INICIAL -->
  <div id="start-screen">
    <button id="start-btn" class="ui-text ui-border" onclick="startApp()">Iniciar rolagem de arcanos</button>
    
    <div class="settings-container">
      
      <!-- Seletor de Cores -->
      <div class="settings-group">
        <div class="settings-title ui-text">Fundo</div>
        <div class="color-swatches" id="swatch-container">
          <div class="swatch" style="background-color: #111111;" onclick="changeTheme('#111111', this, false)"></div>
          <div class="swatch" style="background-color: #F5F5F5;" onclick="changeTheme('#F5F5F5', this, true)"></div>
          <div class="swatch" style="background-color: #161616;" onclick="changeTheme('#161616', this, false)"></div>
          <div class="swatch active" style="background-color: #83A9C7;" onclick="changeTheme('#83A9C7', this, false)"></div>
          <div class="swatch" style="background-color: #C78383;" onclick="changeTheme('#C78383', this, false)"></div>
          <div class="swatch" style="background-color: #C7A583;" onclick="changeTheme('#C7A583', this, false)"></div>
          <div class="swatch" style="background-color: #C7C783;" onclick="changeTheme('#C7C783', this, false)"></div>
          <div class="swatch" style="background-color: #83C783;" onclick="changeTheme('#83C783', this, false)"></div>
          <div class="swatch" style="background-color: #A583C7;" onclick="changeTheme('#A583C7', this, false)"></div>
          <div class="swatch" style="background-color: #C783A5;" onclick="changeTheme('#C783A5', this, false)"></div>
          <input type="color" id="custom-color-picker" class="swatch wheel-picker" value="#D4AF37" title="Escolher cor personalizada">
        </div>
      </div>

      <!-- Filtros da Carta -->
      <div class="settings-group">
        <div class="settings-title ui-text">Filtro de Cor</div>
        <div class="filter-buttons" id="card-filters">
          <button class="opt-btn ui-text ui-border active" onclick="setFilter('none', this)">Normal</button>
          <button class="opt-btn ui-text ui-border" onclick="setFilter('grayscale(100%) contrast(120%)', this)">P&B</button>
          <button class="opt-btn ui-text ui-border" onclick="setFilter('saturate(180%) contrast(105%)', this)">Saturado</button>
        </div>
      </div>

      <!-- Textura Global -->
      <div class="settings-group">
        <div class="settings-title ui-text">Textura Global</div>
        <div class="filter-buttons" id="texture-filters">
          <button class="opt-btn ui-text ui-border active" onclick="setTexture('none', this)">Liso</button>
          <button class="opt-btn ui-text ui-border" onclick="setTexture('grain-1', this)">Grain 1</button>
        </div>
      </div>

      <!-- Botão Grain da Carta -->
      <div class="settings-group">
        <div class="settings-title ui-text">Efeito da Carta</div>
        <button class="preview-card-trigger ui-text ui-border" onclick="openGrainModal()">Grain da Carta</button>
      </div>

    </div>
  </div>

  <!-- TELA PRINCIPAL - REELS -->
  <div id="reels-screen">
    <div class="title ui-text">Pressione o dedo<br>e escolha sua carta</div>

    <div class="card-wrapper">
      <div class="author-tag">@vinitarocchi</div>
      
      <div class="card-inner">
        <img id="tarot-card" src="" alt="Arcano do Tarot">
        <!-- Camada de Grain exclusiva da Carta -->
        <div id="main-card-grain" class="card-grain-layer"></div>
        
        <div id="advice-overlay">
          <div id="card-name">Carregando...</div>
          <div id="card-advice">Conectando ao universo...</div>
        </div>
      </div>
      
    </div>
  </div>

</div>

<!-- POP-UP GRAIN DA CARTA -->
<div id="grain-modal">
  <div class="grain-modal-content">
    <div class="close-modal-btn" onclick="closeGrainModal()">&times;</div>
    
    <div class="popup-card-box">
      <img id="popup-random-card" src="" alt="Carta Aleatória">
      <div id="popup-card-grain" class="card-grain-layer" style="opacity: 0;"></div>
    </div>
    
    <div class="slider-wrapper">
      <div class="slider-label">Intensidade</div>
      <input type="range" id="grain-intensity" class="vertical-slider" min="0" max="1" step="0.05" value="0">
      
      <!-- Novo botão OK -->
      <button id="apply-grain-btn" class="opt-btn ui-text ui-border" style="margin-top: 15px;" onclick="applyGrainAndClose()">OK</button>
    </div>
  </div>
</div>

<script>

  let selectedCards = [];
  let spinInterval;
  let isSpinning = false;
  let currentIndex = 0;
  
  const appContainer = document.getElementById('main-container');
  const startScreen = document.getElementById('start-screen');
  const reelsScreen = document.getElementById('reels-screen');
  const startBtn = document.getElementById('start-btn');
  const tarotCard = document.getElementById('tarot-card');
  const cardName = document.getElementById('card-name');
  const cardAdvice = document.getElementById('card-advice');
  const customColorPicker = document.getElementById('custom-color-picker');

  // Elementos do Modal Grain
  const grainModal = document.getElementById('grain-modal');
  const popupRandomCard = document.getElementById('popup-random-card');
  const grainIntensitySlider = document.getElementById('grain-intensity');
  const mainCardGrain = document.getElementById('main-card-grain');
  const popupCardGrain = document.getElementById('popup-card-grain');

  function changeTheme(colorHex, element, isLightMode) {
    appContainer.style.backgroundColor = colorHex;
    
    if(isLightMode) {
      appContainer.classList.add('light-mode');
    } else {
      appContainer.classList.remove('light-mode');
    }
    
    const swatches = document.querySelectorAll('.swatch');
    swatches.forEach(swatch => swatch.classList.remove('active'));
    element.classList.add('active');
  }

  customColorPicker.addEventListener('input', function(e) {
    const hex = e.target.value;
    
    const rgb = parseInt(hex.slice(1), 16);
    const r = (rgb >> 16) & 0xff;
    const g = (rgb >>  8) & 0xff;
    const b = (rgb >>  0) & 0xff;
    
    const luma = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    const isLight = luma > 128;

    changeTheme(hex, customColorPicker, isLight);
  });

  function setFilter(filterValue, element) {
    tarotCard.style.filter = filterValue;
    
    const btns = document.querySelectorAll('#card-filters .opt-btn');
    btns.forEach(btn => btn.classList.remove('active'));
    element.classList.add('active');
  }

  function setTexture(textureType, element) {
    appContainer.classList.remove('texture-grain-1');
    
    if (textureType !== 'none') {
      appContainer.classList.add(`texture-${textureType}`);
    }

    const btns = document.querySelectorAll('#texture-filters .opt-btn');
    btns.forEach(btn => btn.classList.remove('active'));
    element.classList.add('active');
  }

  function startApp() {
    startBtn.innerText = "Embaralhando...";
    startBtn.style.pointerEvents = "none";
    
    document.querySelector('.settings-container').style.display = 'none';
    
    let shuffled = deck.sort(() => 0.5 - Math.random());
    selectedCards = shuffled.slice(0, 7);

    let loadedCount = 0;
    selectedCards.forEach(card => {
      const img = new Image();
      img.src = card.url;
      img.onload = () => {
        loadedCount++;
        if(loadedCount === 7) initReels();
      };
      img.onerror = () => { 
        loadedCount++;
        if(loadedCount === 7) initReels();
      };
    });
  }

  function initReels() {
    startScreen.style.display = 'none';
    reelsScreen.style.display = 'flex';

    currentIndex = 0;
    updateCardDisplay();
    startSpinning();
  }

  function startSpinning() {
    isSpinning = true;
    spinInterval = setInterval(() => {
      currentIndex = (currentIndex + 1) % 7;
      updateCardDisplay();
    }, 50);
  }

  function updateCardDisplay() {
    const chosenCard = selectedCards[currentIndex];
    tarotCard.src = chosenCard.url;
    cardName.innerText = chosenCard.name;
    cardAdvice.innerText = chosenCard.advice;
  }

  function stopScrolling(e) {
    if(e) e.preventDefault(); 
    if(!isSpinning) return;
    isSpinning = false;
    clearInterval(spinInterval);
  }

  tarotCard.addEventListener('mousedown', stopScrolling);
  tarotCard.addEventListener('touchstart', stopScrolling);

  // === LÓGICA DO POP-UP E AJUSTE DE GRAIN DA CARTA ===

  function openGrainModal() {
    // Sorteia uma carta aleatória para exibir no pop-up de preview
    const randomCard = deck[Math.floor(Math.random() * deck.length)];
    popupRandomCard.src = randomCard.url;
    grainModal.style.display = 'flex';
  }

  function closeGrainModal() {
    grainModal.style.display = 'none';
    // Se o usuário fechar no "X", reseta o slider e a carta de preview para o valor atual real da carta
    const currentOpacity = mainCardGrain.style.opacity || 0;
    grainIntensitySlider.value = currentOpacity;
    popupCardGrain.style.opacity = currentOpacity;
  }

  // O slider agora muda APENAS a carta de preview do modal
  grainIntensitySlider.addEventListener('input', (e) => {
    const intensity = e.target.value;
    popupCardGrain.style.opacity = intensity;
  });

  // Nova função para o botão "OK" aplicar o efeito na tela principal e fechar
  function applyGrainAndClose() {
    const intensity = grainIntensitySlider.value;
    // Aplica o valor na camada das cartas da rolagem
    mainCardGrain.style.opacity = intensity;
    grainModal.style.display = 'none';
  }

</script>
