<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Energia do Dia — Viniastros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&family=Special+Elite&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
  :root{
    --u: 1.1vmin;
    --bg1:#f6efe0; --bg2:#f0e5cd; --bg3:#e9dcbf;
    --gold:#a9895a; --gold-light:#c9a876; --gold-dark:#7c6340;
    --text:#4a3c28; --text-muted:#8a7860;
    --paper:#f6efe0; --paper-line:#d8c9ac; --paper-ink:#4a3c28; --paper-gold:#a9895a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; padding:0; min-height:100vh; overflow-x:hidden;
    background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 50%,var(--bg3) 100%);
    background-attachment:fixed;
    color:var(--text); font-family:'Montserrat',sans-serif; letter-spacing:.3px;
    display:flex; flex-direction:column; align-items:center;
  }
  ::-webkit-scrollbar{width:6px;} ::-webkit-scrollbar-thumb{background:rgba(169,137,90,.35); border-radius:4px;}

  header{ width:100%; padding:10px 16px 4px; text-align:center; }
  header h1{ font-family:'Cinzel',serif; font-size:18px; letter-spacing:4px; text-transform:uppercase; color:var(--gold); margin:0; font-weight:700; }
  header p{ font-size:10px; color:var(--text-muted); margin:6px 0 0; letter-spacing:1px; }

  #gameScreen{ width:100%; max-width:480px; display:flex; flex-direction:column; align-items:center; padding:0 14px 40px; }

  .section-label{ font-family:'Cinzel',serif; font-size:12px; letter-spacing:3px; text-transform:uppercase; color:var(--gold); text-align:center; margin:22px 0 12px; opacity:.9; }
  #gameScreen > .slot-col:first-child .section-label{ margin-top:6px; }
  .row-pair{ display:flex; gap:calc(4*var(--u)); justify-content:center; }

  .card-slot{
    width:calc(15*var(--u)); height:calc(26*var(--u)); max-width:130px; max-height:225px;
    border:1px solid rgba(169,137,90,.5); border-radius:8px; background:rgba(169,137,90,.08);
    display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;
    background-size:cover; background-position:center; cursor:default;
    transition:transform .3s ease, border-color .3s ease;
  }
  .card-slot.empty{ color:var(--text-muted); font-family:'Cinzel',serif; font-size:11px; text-align:center; padding:6px; }
  .card-slot.clickable{ cursor:pointer; border-style:dashed; }
  .card-slot.clickable:active{ transform:scale(.96); border-color:var(--gold-dark); }
  .card-slot.filled{ cursor:pointer; }
  .card-slot .tag{
    position:absolute; bottom:0; left:0; width:100%; background:rgba(74,60,40,.88);
    border-top:1px solid var(--gold); color:#fdf8ee; font-family:'Montserrat',sans-serif;
    font-weight:600; font-size:9px; letter-spacing:.5px; text-transform:uppercase; text-align:center;
    padding:5px 3px; line-height:1.2; word-wrap:break-word;
  }
  body.hide-tags .card-slot .tag{ display:none; }

  .slot-caption{ font-family:'Montserrat',sans-serif; font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-muted); text-align:center; margin-top:6px; }
  .slot-hint{ font-family:'Montserrat',sans-serif; font-size:7.5px; letter-spacing:1px; text-transform:none; color:var(--text-muted); opacity:.55; text-align:center; margin-top:2px; }
  .slot-col{ display:flex; flex-direction:column; align-items:center; }

  #writeBtnWrap{ display:none; width:100%; justify-content:center; margin-top:26px; }
  .btn{
    background:rgba(169,137,90,.08); color:var(--text); border:1px solid var(--gold);
    height:44px; padding:0 18px; border-radius:8px; font-family:'Montserrat',sans-serif;
    font-size:11px; letter-spacing:1.5px; text-transform:uppercase; font-weight:500; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; transition:all .25s ease;
  }
  .btn:active{ background:var(--gold); color:var(--paper); transform:scale(.97); }
  .btn.primary{ background:var(--gold); color:var(--paper); font-weight:600; }
  .btn.primary:active{ background:var(--gold-dark); color:var(--paper); }

  #controls{ display:none; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:18px; width:100%; }
  #controls .btn{ flex:1 1 30%; min-width:110px; font-size:9.5px; height:40px; }

  /* ---- painel inferior de sorteio ---- */
  #drawPanel{
    display:none; position:fixed; left:0; right:0; bottom:0; width:100%;
    background:var(--paper); border-top:1px solid var(--gold);
    padding:14px 10px 18px; z-index:500;
    max-height:52vh; flex-direction:column; align-items:center;
    box-shadow:0 -6px 24px rgba(122,99,64,.18);
  }
  #drawStatus{ font-family:'Cinzel',serif; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--gold-dark); margin-bottom:10px; text-align:center; }
  #drawGrid{ width:100%; flex:1; overflow-y:auto; display:flex; flex-wrap:wrap; gap:6px; justify-content:center; padding:4px; }
  #drawGrid.rows-layout{ flex-direction:column; align-items:center; gap:5px; }
  .draw-row{ display:flex; gap:3px; justify-content:center; width:100%; }
  .back-card{
    width:34px; height:59px; border-radius:5px; border:1px solid var(--gold);
    background-color:#f2e4c8;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 194"><defs><clipPath id="c1"><rect x="35" y="6" width="30" height="28"/></clipPath><clipPath id="c2"><rect x="35" y="31" width="30" height="28"/></clipPath><clipPath id="c3"><rect x="35" y="56" width="30" height="28"/></clipPath><clipPath id="c4"><rect x="35" y="81" width="30" height="28"/></clipPath><clipPath id="c5"><rect x="35" y="106" width="30" height="28"/></clipPath><clipPath id="c6"><rect x="35" y="131" width="30" height="28"/></clipPath><clipPath id="c7"><rect x="35" y="156" width="30" height="28"/></clipPath></defs><rect width="100" height="194" fill="%23f2e4c8"/><g fill="%23a9895a" opacity="0.55"><circle cx="14" cy="8" r="0.8"/><path d="M86 7 l1 3 3 1 -3 1 -1 3 -1 -3 -3 -1 3 -1 z"/><circle cx="20" cy="30" r="0.6"/><circle cx="84" cy="34" r="0.9"/><circle cx="12" cy="55" r="0.7"/><path d="M89 57 l1 2.5 2.5 1 -2.5 1 -1 2.5 -1 -2.5 -2.5 -1 2.5 -1 z"/><circle cx="15" cy="80" r="0.9"/><circle cx="86" cy="83" r="0.7"/><path d="M13 106 l1 2.5 2.5 1 -2.5 1 -1 2.5 -1 -2.5 -2.5 -1 2.5 -1 z"/><circle cx="88" cy="109" r="0.9"/><circle cx="17" cy="133" r="0.6"/><circle cx="83" cy="136" r="0.8"/><circle cx="11" cy="158" r="0.8"/><circle cx="90" cy="161" r="0.6"/><circle cx="20" cy="178" r="0.6"/><circle cx="80" cy="180" r="0.7"/></g><g clip-path="url(%23c1)"><circle cx="50" cy="20" r="13" fill="%23d9843a"/><circle cx="50" cy="12" r="13" fill="%23f2e4c8"/></g><g clip-path="url(%23c2)"><circle cx="50" cy="45" r="13" fill="%23e8ab48"/><circle cx="50" cy="30" r="13" fill="%23f2e4c8"/></g><g clip-path="url(%23c3)"><circle cx="50" cy="70" r="13" fill="%23f0c94e"/><circle cx="50" cy="49" r="13" fill="%23f2e4c8"/></g><g clip-path="url(%23c4)"><circle cx="50" cy="95" r="13" fill="%23f5d768"/><circle cx="45" cy="91" r="1.2" fill="%23d9b84a" opacity="0.5"/><circle cx="55" cy="99" r="1" fill="%23d9b84a" opacity="0.4"/><circle cx="46" cy="101" r="0.8" fill="%23d9b84a" opacity="0.4"/><circle cx="56" cy="90" r="0.7" fill="%23d9b84a" opacity="0.4"/></g><g clip-path="url(%23c5)"><circle cx="50" cy="120" r="13" fill="%238a6f3f"/><circle cx="50" cy="141" r="13" fill="%23f2e4c8"/></g><g clip-path="url(%23c6)"><circle cx="50" cy="145" r="13" fill="%238a6f3f"/><circle cx="50" cy="160" r="13" fill="%23f2e4c8"/></g><g clip-path="url(%23c7)"><circle cx="50" cy="170" r="13" fill="%238a6f3f"/><circle cx="50" cy="178" r="13" fill="%23f2e4c8"/></g><line x1="18" y1="186" x2="82" y2="186" stroke="%23a9895a" stroke-width="0.7"/><line x1="18" y1="189" x2="82" y2="189" stroke="%23a9895a" stroke-width="0.7"/></svg>');
    background-size:cover; background-position:center;
    cursor:pointer; flex-shrink:0; transition:transform .25s ease;
  }
  .back-card.minor{ width:min(7.2vw, 24px); height:min(12.6vw, 42px); }
  .back-card:active{ transform:translateY(-4px) scale(1.08); }
  .back-card.revealed{ opacity:0; pointer-events:none; }
  .shuffle-wrap{ display:flex; align-items:center; justify-content:center; width:100%; min-height:80px; }
  .shuffle-card{ width:34px; height:59px; border-radius:5px; border:1px solid var(--gold); background:linear-gradient(160deg, var(--bg3), var(--bg1)); position:absolute; animation:shuf 1.3s cubic-bezier(.25,1,.5,1) infinite; }
  @keyframes shuf{ 0%{transform:translateX(0) translateY(0) rotate(0);} 20%{transform:translateX(-22px) translateY(-10px) rotate(-14deg);} 40%{transform:translateX(0) translateY(-14px) rotate(0);} 60%{transform:translateX(22px) translateY(-10px) rotate(14deg);} 100%{transform:translateX(0) translateY(0) rotate(0);} }

  /* ---- modal detalhe ---- */
  .modal{ display:none; position:fixed; inset:0; background:rgba(74,60,40,.35); z-index:1100; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
  .modal-content{ background:var(--paper); border:1px solid var(--gold); border-radius:14px; width:88%; max-width:340px; max-height:86vh; overflow-y:auto; padding:20px; box-shadow:0 10px 40px rgba(122,99,64,.25); }
  .modal-content h2{ font-family:'Cinzel',serif; font-size:16px; color:var(--gold-dark); margin:0 0 12px; text-transform:uppercase; letter-spacing:1.5px; text-align:center; }
  .modal-content img{ width:130px; display:block; margin:0 auto 14px; border-radius:6px; border:1px solid var(--gold); }
  .modal-content .verbs{ text-align:center; color:var(--gold-dark); font-weight:600; font-size:13px; margin-bottom:12px; }
  .modal-content .situ{ font-size:12px; line-height:1.6; color:var(--text); }
  .close-x{ float:right; background:none; border:none; color:var(--text-muted); font-size:22px; cursor:pointer; margin-top:-8px; }

  /* ---- popup de escolha manual (Maiores / Menores) ---- */
  #manualPickerModal .modal-content{ max-width:380px; width:92%; }
  .mp-tabs{ display:flex; gap:8px; justify-content:center; margin-bottom:14px; }
  .mp-tab{ flex:1; padding:9px 4px; border:1px solid var(--gold); border-radius:6px; background:transparent; color:var(--text); font-family:'Cinzel',serif; font-size:11px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; transition:all .2s ease; }
  .mp-tab.active{ background:var(--gold); color:var(--paper); font-weight:700; }
  .mp-pane{ }
  .mp-suit-row{ display:flex; gap:6px; justify-content:center; margin-bottom:10px; flex-wrap:wrap; }
  .mp-suit-btn{ padding:6px 13px; border:1px solid var(--gold); border-radius:20px; font-size:9.5px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; color:var(--text); background:rgba(169,137,90,.08); transition:all .2s ease; }
  .mp-suit-btn.active{ background:var(--gold); color:var(--paper); }
  .mp-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; max-height:340px; overflow-y:auto; padding:4px; }
  .mp-thumb{ aspect-ratio:0.58; background-size:cover; background-position:center; border-radius:5px; border:1px solid var(--gold); cursor:pointer; transition:transform .2s ease; }
  .mp-thumb:active{ transform:scale(.92); }

  /* ============================= PLANNER ============================= */
  #plannerOverlay{
    display:none; position:fixed; inset:0; background:var(--paper); z-index:1000;
    flex-direction:column; align-items:center; justify-content:flex-start; overflow:hidden; padding:0;
  }

  #plannerPage{
    width:100vw;
    height:100vh;
    height:100dvh;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 10% 8%, rgba(169,137,90,.06), transparent 30%),
      radial-gradient(circle at 90% 92%, rgba(169,137,90,.06), transparent 30%);
    border-radius:0;
    position:relative; overflow-y:auto;
    padding:6% 8%;
    display:flex; flex-direction:column; align-items:center;
    font-family:'Special Elite', monospace;
    color:var(--paper-ink);
  }

  .orn{ color:var(--paper-gold); opacity:.85; }
  .orn-row{ display:flex; align-items:center; justify-content:center; gap:6px; width:100%; }
  .orn-line{ flex:1; height:1px; background:var(--paper-gold); opacity:.5; max-width:60px; position:relative; top:4px; }
  .sunburst{ font-size:20px; text-align:center; color:var(--paper-gold); margin-bottom:2%; line-height:1; flex-shrink:0; }

  .date-box{
    border:1px solid var(--paper-gold); border-radius:30px; padding:6px 22px; margin:2% 0 3%;
    display:flex; align-items:center; gap:4px; font-size:13px; letter-spacing:1px; color:var(--paper-ink);
    flex-shrink:0;
  }
  .date-box span[contenteditable]{ outline:none; min-width:14px; display:inline-block; text-align:center; }
  .date-box span.sep{ opacity:.6; }

  .days-row{ display:flex; gap:6px; margin-bottom:4%; flex-shrink:0; }
  .day-circle{
    width:22px; height:22px; border-radius:50%; border:1px solid var(--paper-gold);
    display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--paper-ink);
    cursor:pointer; user-select:none; background:transparent; transition:all .2s ease;
  }
  .day-circle.selected{ background:var(--paper-gold); color:var(--paper); border-color:var(--paper-gold); }

  .plabel{ font-family:'Montserrat',sans-serif; font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--paper-ink); text-align:center; margin:1% 0 3%; opacity:.85; flex-shrink:0; }
  .plabel.conselho{ font-family:'Playfair Display', serif; font-style:italic; font-size:19px; letter-spacing:0; text-transform:none; margin:4% 0 2.5%; flex-shrink:0; }
  .orn-row{ flex-shrink:0; }

  .sticker-row{ display:flex; gap:calc(4*var(--u)); justify-content:center; margin-bottom:2.5%; width:100%; flex-shrink:0; }
  .sticker{
    width:calc(15*var(--u)); height:calc(26*var(--u)); max-width:130px; max-height:225px; border-radius:8px;
    border:1px solid var(--paper-gold);
    background:transparent; position:relative; overflow:hidden; cursor:pointer; flex-shrink:0;
  }
  .sticker .art{ position:absolute; inset:0; background-size:cover; background-position:center; }

  .write-lines{
    width:100%; height:95px; outline:none; font-family:'Special Elite', monospace; font-size:11px;
    color:var(--paper-ink); line-height:19px; background-image:repeating-linear-gradient(to bottom, transparent 0, transparent 18px, var(--paper-line) 18px, var(--paper-line) 19px);
    padding-top:1px; overflow:hidden; margin-bottom:2%; flex-shrink:0;
  }

  .corner{ position:absolute; font-size:15px; color:var(--paper-gold); opacity:.7; }
  .corner.tl{ top:10px; left:12px; cursor:pointer; } .corner.tr{ top:10px; right:12px; }
  .corner.bl{ bottom:10px; left:12px; } .corner.br{ bottom:10px; right:12px; }
  .sparkle{ position:absolute; font-size:9px; color:var(--paper-gold); opacity:.6; }
</style>
</head>
<body>

<header>
  <h1>Viniastros</h1>
</header>

<div id="gameScreen">

  <div class="slot-col" style="width:100%;">
    <div class="section-label">Energia do Dia</div>
    <div class="row-pair">
      <div class="slot-col">
        <div class="card-slot empty" id="slot-dia-maior" data-slot="dia-maior" onclick="onSlotClick('dia-maior')">Maior</div>
        <div class="slot-caption">Arcano Maior</div>
        <div class="slot-hint">toque para escolher</div>
      </div>
      <div class="slot-col">
        <div class="card-slot empty" id="slot-dia-menor" data-slot="dia-menor" onclick="onSlotClick('dia-menor')">Menor</div>
        <div class="slot-caption">Arcano Menor</div>
        <div class="slot-hint">toque para escolher</div>
      </div>
    </div>
  </div>

  <div class="slot-col" style="width:100%;">
    <div class="section-label">Conselho</div>
    <div class="row-pair">
      <div class="slot-col">
        <div class="card-slot empty" id="slot-conselho-maior" data-slot="conselho-maior" onclick="onSlotClick('conselho-maior')">Maior</div>
        <div class="slot-caption">Arcano Maior</div>
        <div class="slot-hint">toque para escolher</div>
      </div>
      <div class="slot-col">
        <div class="card-slot empty" id="slot-conselho-menor" data-slot="conselho-menor" onclick="onSlotClick('conselho-menor')">Menor</div>
        <div class="slot-caption">Arcano Menor</div>
        <div class="slot-hint">toque para escolher</div>
      </div>
    </div>
  </div>

  <div id="writeBtnWrap">
    <button class="btn primary" onclick="openPlanner()">Escreva sobre seu dia</button>
  </div>

  <div id="controls">
    <button class="btn" id="btnToggleTags" onclick="toggleTags()">Ocultar Significados</button>
    <button class="btn" onclick="updateTags()">Atualizar Significados</button>
    <button class="btn" onclick="resetGame()">Limpar Jogo</button>
  </div>

</div>

<div id="drawPanel">
  <div id="drawStatus">Selecione uma carta</div>
  <div id="drawGrid"></div>
</div>

<div id="detailModal" class="modal">
  <div class="modal-content">
    <button class="close-x" onclick="closeDetail()">&times;</button>
    <h2 id="detailName">Arcano</h2>
    <img id="detailImg" src="" alt="">
    <div class="verbs" id="detailVerbs"></div>
    <div class="situ" id="detailSitu"></div>
  </div>
</div>

<!-- ================= POPUP DE ESCOLHA MANUAL ================= -->
<div id="manualPickerModal" class="modal">
  <div class="modal-content">
    <button class="close-x" onclick="closeManualPicker()">&times;</button>
    <h2>Escolher Arcano</h2>
    <div class="mp-tabs">
      <button type="button" class="mp-tab active" id="mpTabMaior" onclick="switchMpTab('maior')">Maiores</button>
      <button type="button" class="mp-tab" id="mpTabMenor" onclick="switchMpTab('menor')">Menores</button>
    </div>
    <div id="mpMaiorPane" class="mp-pane">
      <div id="mpMaiorGrid" class="mp-grid"></div>
    </div>
    <div id="mpMenorPane" class="mp-pane" style="display:none;">
      <div id="mpSuitRow" class="mp-suit-row"></div>
      <div id="mpMenorGrid" class="mp-grid"></div>
    </div>
  </div>
</div>

<!-- ================= PLANNER ================= -->
<div id="plannerOverlay">
  <div id="plannerPage">
    <span class="corner tl" onclick="closePlanner()">☾</span>
    <span class="corner tr">☽</span>
    <div class="sunburst">✦ ⋆ ☼ ⋆ ✦</div>

    <div class="date-box">
      <span contenteditable="true" id="dDay">__</span><span class="sep">/</span>
      <span contenteditable="true" id="dMonth">__</span><span class="sep">/</span>
      <span contenteditable="true" id="dYear">____</span>
    </div>

    <div class="days-row" id="daysRow"></div>

    <div class="orn-row"><span class="orn-line"></span><span class="plabel conselho">Energia do Dia</span><span class="orn-line"></span></div>
    <div class="sticker-row">
      <div class="sticker" id="stickerDiaMaior"><div class="art" id="pStickerDiaMaior"></div></div>
      <div class="sticker" id="stickerDiaMenor"><div class="art" id="pStickerDiaMenor"></div></div>
    </div>
    <div class="write-lines" contenteditable="true" id="writeDia"></div>

    <div class="orn-row"><span class="orn-line"></span><span class="plabel conselho">Conselho</span><span class="orn-line"></span></div>
    <div class="sticker-row">
      <div class="sticker" id="stickerConselhoMaior"><div class="art" id="pStickerConselhoMaior"></div></div>
      <div class="sticker" id="stickerConselhoMenor"><div class="art" id="pStickerConselhoMenor"></div></div>
    </div>
    <div class="write-lines" contenteditable="true" id="writeConselho"></div>

    <span class="corner bl">☾</span>
    <span class="corner br">☽</span>
  </div>
</div>

<script>
/* ============================================================
   DECK — apenas Radiant Waite
   ============================================================ */
const RADIANT_BASE = 'https://marycusack.com/Decks/Images/Tarot/R/Radiant/';

const majorNames = [
  "0 - O Louco","1 - O Mago","2 - A Sacerdotisa","3 - A Imperatriz",
  "4 - O Imperador","5 - O Hierofante","6 - Os Enamorados","7 - O Carro",
  "8 - A Força","9 - O Eremita","10 - A Roda da Fortuna","11 - A Justiça",
  "12 - O Enforcado","13 - A Morte","14 - A Temperança","15 - O Diabo",
  "16 - A Torre","17 - A Estrela","18 - A Lua","19 - O Sol",
  "20 - O Julgamento","21 - O Mundo"
];
const majorFileNames = [
  "00%20Fool","01%20Magician","02%20Priestess","03%20Empress",
  "04%20Emperor","05%20Hierophant","06%20Lovers","07%20Chariot",
  "08%20Strength","09%20Hermit","10%20Wheel","11%20Justice",
  "12%20Hanged","13%20Death","14%20Temperance","15%20Devil",
  "16%20Tower","17%20Star","18%20Moon","19%20Sun",
  "20%20Judgement","21%20World"
];

function generateMinors(prefix, suitLabel){
  let cards = [];
  for (let i = 1; i <= 10; i++) {
    let numStr = String(i).padStart(2,'0');
    cards.push({ name: i===1 ? `Ás de ${suitLabel}` : `${i} de ${suitLabel}`, url: `${RADIANT_BASE}${prefix}${numStr}.jpg` });
  }
  const courtNames = ['Pajem','Cavaleiro','Rainha','Rei'];
  const courtSuffixes = ['C1P','C2K','C3Q','C4K'];
  courtNames.forEach((n,i)=> cards.push({ name:`${n} de ${suitLabel}`, url:`${RADIANT_BASE}${prefix}${courtSuffixes[i]}.jpg` }));
  return cards;
}

const deck = {
  major: majorNames.map((name,i)=>({ name, url:`${RADIANT_BASE}${majorFileNames[i]}.jpg` })),
  pentacles: generateMinors('P','Ouros'),
  swords: generateMinors('S','Espadas'),
  cups: generateMinors('C','Copas'),
  wands: generateMinors('W','Paus')
};
function allMinors(){ return [...deck.pentacles, ...deck.swords, ...deck.cups, ...deck.wands]; }

let slots = {
  'dia-maior': null, 'dia-menor': null,
  'conselho-maior': null, 'conselho-menor': null
};
const sequence = [
  { slot:'dia-maior', pool:'major', label:'Energia do Dia — Escolha o Arcano Maior' },
  { slot:'dia-menor', pool:'minor', label:'Energia do Dia — Escolha o Arcano Menor' },
  { slot:'conselho-maior', pool:'major', label:'Conselho — Escolha o Arcano Maior' },
  { slot:'conselho-menor', pool:'minor', label:'Conselho — Escolha o Arcano Menor' }
];
let seqIndex = 0;
let tagsVisible = true;

const drawPanel = document.getElementById('drawPanel');
const drawGrid = document.getElementById('drawGrid');
const drawStatus = document.getElementById('drawStatus');

function onSlotClick(slotKey){
  const el = document.getElementById('slot-'+slotKey);
  if (slots[slotKey]) {
    openDetail(slots[slotKey]);
    return;
  }
  // clicar em qualquer slot vazio abre o popup de escolha manual, sem depender da ordem da sequência
  openManualPicker(slotKey);
}

function runStep(){
  if (seqIndex >= sequence.length) { finishGame(); return; }
  const step = sequence[seqIndex];
  drawPanel.style.display = 'flex';
  drawStatus.textContent = 'EMBARALHANDO...';
  drawGrid.innerHTML = '<div class="shuffle-wrap"></div>';
  const wrap = drawGrid.querySelector('.shuffle-wrap');
  for (let i=0;i<10;i++){
    const c = document.createElement('div');
    c.className='shuffle-card';
    c.style.animationDelay = (i*0.09)+'s';
    wrap.appendChild(c);
  }
  setTimeout(()=>renderDrawGrid(step), 1100);
}

function renderDrawGrid(step){
  drawStatus.textContent = step.label;
  drawGrid.innerHTML = '';
  const pool = shuffle(step.pool==='major' ? [...deck.major] : [...allMinors()]);

  const makeBack = (cardData)=>{
    const back = document.createElement('div');
    back.className = 'back-card' + (step.pool==='minor' ? ' minor' : '');
    back.onclick = ()=>{
      if (back.classList.contains('revealed')) return;
      back.classList.add('revealed');
      fillSlot(step.slot, cardData);
    };
    return back;
  };

  if (step.pool === 'minor') {
    // 4 fileiras de 12 cartas + última fileira centralizada com 8 cartas (total 56)
    drawGrid.classList.add('rows-layout');
    const rowSizes = [12,12,12,12,8];
    let cursor = 0;
    rowSizes.forEach(size=>{
      const row = document.createElement('div');
      row.className = 'draw-row';
      for (let i=0; i<size && cursor<pool.length; i++, cursor++){
        row.appendChild(makeBack(pool[cursor]));
      }
      drawGrid.appendChild(row);
    });
  } else {
    drawGrid.classList.remove('rows-layout');
    pool.forEach(cardData=> drawGrid.appendChild(makeBack(cardData)));
  }
}

function nextPendingIndex(){
  return sequence.findIndex(s => !slots[s.slot]);
}

function fillSlot(slotKey, cardData){
  slots[slotKey] = cardData;
  const el = document.getElementById('slot-'+slotKey);
  el.classList.remove('empty');
  el.classList.add('filled');
  el.style.backgroundImage = `url(${cardData.url})`;
  el.textContent = '';
  el.onclick = ()=>openDetail(cardData);
  injectTag(el, cardData.name);
  seqIndex = nextPendingIndex();
  setTimeout(()=>{
    if (seqIndex !== -1) {
      runStep();
    } else {
      drawPanel.style.display = 'none';
      finishGame();
    }
  }, 550);
}

function injectTag(el, cardName, forceNext=false){
  let cleanName = cardName.replace(/^\d+\s*[-–]\s*/,'').trim();
  let pool = verbsMap[cleanName] || ['Fluxo'];
  let usedAttr = el.getAttribute('data-used');
  let used = usedAttr ? JSON.parse(usedAttr) : [];
  let idx;
  if (forceNext && pool.length>1){
    let avail = pool.map((_,i)=>i).filter(i=>!used.includes(i));
    if (avail.length===0){ used=[]; avail = pool.map((_,i)=>i); }
    idx = avail[Math.floor(Math.random()*avail.length)];
  } else {
    idx = Math.floor(Math.random()*pool.length);
    used = [];
  }
  used.push(idx);
  el.setAttribute('data-used', JSON.stringify(used));
  el.setAttribute('data-idx', idx);
  const old = el.querySelector('.tag');
  if (old) old.remove();
  const tag = document.createElement('div');
  tag.className='tag';
  tag.textContent = pool[idx];
  el.appendChild(tag);
}

function shuffle(arr){
  let a=[...arr], c=a.length, r;
  while(c!==0){ r=Math.floor(Math.random()*c); c--; [a[c],a[r]]=[a[r],a[c]]; }
  return a;
}

function finishGame(){
  document.getElementById('writeBtnWrap').style.display = 'flex';
  document.getElementById('controls').style.display = 'flex';
}

function resetGame(){
  slots = { 'dia-maior':null,'dia-menor':null,'conselho-maior':null,'conselho-menor':null };
  seqIndex = 0;
  ['dia-maior','dia-menor','conselho-maior','conselho-menor'].forEach(k=>{
    const el = document.getElementById('slot-'+k);
    el.className = 'card-slot empty';
    el.style.backgroundImage='';
    el.textContent = k.includes('maior') ? 'Maior' : 'Menor';
    el.removeAttribute('data-used');
    el.removeAttribute('data-idx');
    el.onclick = ()=>onSlotClick(k);
  });
  document.getElementById('writeBtnWrap').style.display='none';
  document.getElementById('controls').style.display='none';
  drawPanel.style.display='none';
  runStep();
}

function toggleTags(){
  tagsVisible = !tagsVisible;
  document.body.classList.toggle('hide-tags', !tagsVisible);
  document.getElementById('btnToggleTags').textContent = tagsVisible ? 'Ocultar Significados' : 'Ligar Significados';
}

function updateTags(){
  Object.keys(slots).forEach(k=>{
    if (slots[k]){
      const el = document.getElementById('slot-'+k);
      injectTag(el, slots[k].name, true);
    }
  });
}

/* ---- modal de detalhe ---- */
function openDetail(cardData){
  const clean = cardData.name.replace(/^\d+\s*[-–]\s*/,'').trim();
  document.getElementById('detailName').textContent = cardData.name;
  document.getElementById('detailImg').src = cardData.url;
  const pool = verbsMap[clean] || ['Fluxo'];
  document.getElementById('detailVerbs').textContent = pool.join(', ');
  document.getElementById('detailSitu').textContent = situacaoMap[clean] || '';
  document.getElementById('detailModal').style.display='flex';
}
function closeDetail(){ document.getElementById('detailModal').style.display='none'; }

/* ============================================================
   POPUP DE ESCOLHA MANUAL (Maiores / Menores)
   Acionado por toque-e-segure (long press) num slot vazio,
   sem remover ou alterar o fluxo de sorteio/embaralhamento.
   ============================================================ */
let mpCurrentSlot = null;

const suitDefs = [
  { key:'pentacles', label:'Ouros' },
  { key:'swords',     label:'Espadas' },
  { key:'cups',       label:'Copas' },
  { key:'wands',      label:'Paus' }
];

function openManualPicker(slotKey){
  if (slots[slotKey]) return; // já preenchido, nada a escolher

  mpCurrentSlot = slotKey;
  buildMpMaiorGrid();
  document.getElementById('mpSuitRow').innerHTML = '';
  switchMpTab('maior');
  document.getElementById('manualPickerModal').style.display = 'flex';
}

function closeManualPicker(){
  document.getElementById('manualPickerModal').style.display = 'none';
  mpCurrentSlot = null;
}

function switchMpTab(tab){
  document.getElementById('mpTabMaior').classList.toggle('active', tab==='maior');
  document.getElementById('mpTabMenor').classList.toggle('active', tab==='menor');
  document.getElementById('mpMaiorPane').style.display = tab==='maior' ? 'block' : 'none';
  document.getElementById('mpMenorPane').style.display = tab==='menor' ? 'block' : 'none';
  if (tab==='menor' && !document.getElementById('mpSuitRow').hasChildNodes()){
    buildMpSuitRow();
  }
}

function buildMpMaiorGrid(){
  const grid = document.getElementById('mpMaiorGrid');
  grid.innerHTML = '';
  deck.major.forEach(card=>{
    const thumb = document.createElement('div');
    thumb.className = 'mp-thumb';
    thumb.style.backgroundImage = `url(${card.url})`;
    thumb.title = card.name;
    thumb.onclick = ()=> selectManualCard(card);
    grid.appendChild(thumb);
  });
}

function buildMpSuitRow(){
  const row = document.getElementById('mpSuitRow');
  row.innerHTML = '';
  suitDefs.forEach(s=>{
    const btn = document.createElement('div');
    btn.className = 'mp-suit-btn';
    btn.textContent = s.label;
    btn.dataset.suit = s.key;
    btn.onclick = ()=> buildMpMenorGrid(s.key);
    row.appendChild(btn);
  });
  buildMpMenorGrid(suitDefs[0].key);
}

function buildMpMenorGrid(suitKey){
  document.querySelectorAll('.mp-suit-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.suit === suitKey);
  });
  const grid = document.getElementById('mpMenorGrid');
  grid.innerHTML = '';
  deck[suitKey].forEach(card=>{
    const thumb = document.createElement('div');
    thumb.className = 'mp-thumb';
    thumb.style.backgroundImage = `url(${card.url})`;
    thumb.title = card.name;
    thumb.onclick = ()=> selectManualCard(card);
    grid.appendChild(thumb);
  });
}

function selectManualCard(card){
  if (!mpCurrentSlot) return;
  const slotKey = mpCurrentSlot;
  closeManualPicker();
  fillSlot(slotKey, card);
}

/* ============================================================
   PLANNER
   ============================================================ */
const dayLabels = ['S','T','Q','Q','S','S','D'];
function buildDaysRow(){
  const row = document.getElementById('daysRow');
  row.innerHTML='';
  dayLabels.forEach((l,i)=>{
    const c = document.createElement('div');
    c.className='day-circle';
    c.textContent=l;
    c.onclick=()=>{
      document.querySelectorAll('.day-circle').forEach(x=>x.classList.remove('selected'));
      c.classList.add('selected');
    };
    row.appendChild(c);
  });
}
buildDaysRow();

function openPlanner(){
  document.getElementById('pStickerDiaMaior').style.backgroundImage = `url(${slots['dia-maior'].url})`;
  document.getElementById('pStickerDiaMenor').style.backgroundImage = `url(${slots['dia-menor'].url})`;
  document.getElementById('pStickerConselhoMaior').style.backgroundImage = `url(${slots['conselho-maior'].url})`;
  document.getElementById('pStickerConselhoMenor').style.backgroundImage = `url(${slots['conselho-menor'].url})`;

  document.getElementById('stickerDiaMaior').onclick = ()=>openDetail(slots['dia-maior']);
  document.getElementById('stickerDiaMenor').onclick = ()=>openDetail(slots['dia-menor']);
  document.getElementById('stickerConselhoMaior').onclick = ()=>openDetail(slots['conselho-maior']);
  document.getElementById('stickerConselhoMenor').onclick = ()=>openDetail(slots['conselho-menor']);

  const now = new Date();
  if (document.getElementById('dDay').textContent === '__') {
    document.getElementById('dDay').textContent = String(now.getDate()).padStart(2,'0');
    document.getElementById('dMonth').textContent = String(now.getMonth()+1).padStart(2,'0');
    document.getElementById('dYear').textContent = String(now.getFullYear());
  }
  document.getElementById('plannerOverlay').style.display='flex';
}
function closePlanner(){
  document.getElementById('plannerOverlay').style.display='none';
}

/* ---- início automático ---- */
runStep();
</script>
